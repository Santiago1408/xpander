# Integration tests against a disposable PostgreSQL. It is a separate Compose
# project with the database in memory: it never touches the development data.
name: xpander_test

services:
  database:
    image: postgres:18.6
    environment:
      POSTGRES_DB: xpander_test
      POSTGRES_USER: xpander
      POSTGRES_PASSWORD: xpander_test_only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: ["go", "test", "-tags", "integration", "-count=1", "-v", "-run", "TestStoreFlows", "./cmd/server"]
    environment:
      TEST_DATABASE_URL: postgres://xpander:xpander_test_only@database:5432/xpander_test?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
