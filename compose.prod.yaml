# Production stack. Secrets and the domain come from .env (see
# .env.production.example); API and database never publish public ports.
# The guide is docs/15-despliegue.md.
name: xpander

x-api-image: &api-image
  build:
    context: ./api
  image: xpander-api:latest

x-database-url: &database-url postgres://xpander:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@database:5432/xpander?sslmode=disable

services:
  database:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: xpander
      POSTGRES_USER: xpander
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - private

  migrate:
    <<: *api-image
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      database:
        condition: service_healthy
    networks:
      - private

  bootstrap:
    <<: *api-image
    profiles: ["setup"]
    command: ["/app/bootstrap"]
    environment:
      DATABASE_URL: *database-url
    stdin_open: true
    tty: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  # Sets a new password for an administrator who forgot it (docs/05-acceso-admin.md).
  reset-password:
    <<: *api-image
    profiles: ["setup"]
    command: ["/app/reset_password"]
    environment:
      DATABASE_URL: *database-url
    stdin_open: true
    tty: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Define PUBLIC_ORIGIN en .env}
      MEDIA_DIR: /srv/media
      ORDER_WHATSAPP_NUMBER: ${ORDER_WHATSAPP_NUMBER:?Define ORDER_WHATSAPP_NUMBER en .env}
      TRUST_PROXY_HEADERS: "true"
      DATABASE_URL: *database-url
    volumes:
      - media_data:/srv/media
    # Only reachable from the VPS itself, for a Caddy installed as a system service.
    ports:
      - "127.0.0.1:${XPANDER_API_PORT:-18080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  web:
    build:
      context: .
      args:
        XPANDER_API_ORIGIN: http://api:8080
        XPANDER_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Define PUBLIC_ORIGIN en .env}
    image: xpander-web:latest
    restart: unless-stopped
    environment:
      XPANDER_API_ORIGIN: http://api:8080
      XPANDER_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Define PUBLIC_ORIGIN en .env}
    ports:
      - "127.0.0.1:${XPANDER_WEB_PORT:-13000}:3000"
    depends_on:
      - api
    networks:
      - private

networks:
  private:

volumes:
  database_data:
  media_data:
